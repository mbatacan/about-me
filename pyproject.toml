[project]
name = "lang-chain-vec-db"
version = "0.1.0"
description = "DS Repo Template"
authors = [{name = "Matt Batacan", email = "mattbatacan@gmail.com"}]
requires-python = ">=3.11"
dependencies = [
    "flask-session>=0.6.0,<0.7.0",
    "flask>=3.0.2,<4.0.0",
    "gunicorn>=22.0.0",
    "langchain-community>=0.0.38,<0.1.0",
    "langchain-openai>=0.0.8,<0.0.9",
    "langchain-pinecone>=0.0.3,<0.0.4",
    "langchain-text-splitters>=0.0.1,<0.1.0",
    "langchain>=0.1.12,<0.2.0",
    "pinecone-client>=3.1.0,<4.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src",
]

[dependency-groups]
dev = [
    "bandit",
    "black",
    "flake8",
    "ipykernel",
    "isort",
    "mkdocs",
    "mkdocs-autorefs",
    "mkdocs-git-revision-date-plugin",
    "mkdocs-material",
    "mypy",
    "pre-commit",
    "pymdown-extensions",
    "pytest",
    "pytest-cov",
    "ruff",
    "types-PyYAML",
]

[tool.black]
exclude = "^tests/"
line-length = 88
skip-string-normalization = true
[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]
line-length = 88
target-version = "py39" # Python 3.9
[tool.isort]
profile = "black"
known_third_party = "carrot"
default_section = "THIRDPARTY"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
line_length = 88
